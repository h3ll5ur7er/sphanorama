name: deploy

# Deploys the built PWA to GitHub Pages. Only from the default branch: a feature branch
# publishing over the live site is a surprise nobody wants.
#
# The push trigger restricts itself, but workflow_dispatch does not — it runs against whatever ref
# the person launching it picked, so "only from main" was a comment rather than a rule. Both jobs
# now check the ref, which is where the restriction has to live for it to hold.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one midway: a half-published site is worse than a
# stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # OpenCV is cross-compiled into the core's build (ADR 0069), and nothing here links it: the
      # module does not call the engine yet, so only the module is built. The cache is CI's, under
      # CI's key, and restored without being saved — this job builds none of OpenCV, and a cache it
      # saved would be the configured tree without the objects, restored by CI on every hit after.
      - name: record the toolchain identity
        run: |
          { emcc --version; ninja --version; cmake --version; } > .toolchain-identity
          cat .toolchain-identity
      - name: restore CI's OpenCV build
        uses: actions/cache/restore@v4
        with:
          path: |
            build/wasm-release/_deps
            build/wasm-release/.ninja_log
            build/wasm-release/.ninja_deps
            build/wasm-release/cvconfig.h
            build/wasm-release/cv_cpu_config.h
            build/wasm-release/custom_hal.hpp
            build/wasm-release/opencv_data_config.hpp
            build/wasm-release/opencv2
          key: opencv-v2-wasm-release-${{ runner.os }}-${{ hashFiles('cmake/opencv.cmake', 'CMakePresets.json', '.toolchain-identity') }}
      # The single-threaded build, because GitHub Pages cannot serve COOP/COEP and the threaded
      # one does not degrade without it — it hangs on load (ADR 0011).
      - name: build core
        run: cmake --preset wasm-release && cmake --build build/wasm-release --target sphanorama_module
      - name: size budget
        run: uv run --locked tools/size_budget.py --profile wasm-release --build-dir build/wasm-release/bridge

      - name: install shell deps
        run: npm ci
      - name: build shell
        env:
          # Pages serves the project site from /<repo>/, so the bundle needs that prefix.
          SPHANORAMA_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # The same end-to-end suite CI runs, against the bundle about to be published — so a broken
      # deploy fails here rather than on someone's phone. SPHANORAMA_BASE is passed again on
      # purpose: it is what mounts the test server at the same prefix Pages will, and without it
      # every asset URL in the bundle 404s and the verification proves nothing.
      - name: verify the bundle
        env:
          SPHANORAMA_BASE: /${{ github.event.repository.name }}/
        run: npx playwright install --with-deps chromium && npx playwright test shell/e2e

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
