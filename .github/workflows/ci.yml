          # written down, so a fourth detector cannot go unmeasured.
          expected=$(./build/native-asan/bin/sphanorama_tests --gtest_list_tests \
            --gtest_filter='EveryDetector/Accuracy.ConsecutiveFrames*' | grep -c 'ConsecutiveFrames')
          ./build/native-asan/bin/sphanorama_tests --gtest_filter="$filter" >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          measured=$(grep -c '^\[accuracy\]' "$log" || true)
          # **Both counts go to zero together when the suite is renamed away**, so comparing them is
          # not enough — the first version of this check was green on a binary with no measurement in
          # it at all, which is precisely the hole it was written to close. The floor is what makes
          # the comparison mean something.
          if [ "$expected" -lt 1 ]; then
            echo "the binary contains no accuracy measurement to run" >&2
            status=1
          fi
          if [ "$measured" -ne "$expected" ]; then
            echo "the measurement ran $measured detectors and the binary has $expected" >&2
            status=1
          fi
          if grep -q SKIPPED "$log"; then
            echo "something skipped, and a skip is not a pass" >&2
            status=1
          fi
          rm -f "$log"
          exit $status

  wasm:
    name: wasm builds, size budget and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned to match tools/setup_emsdk.sh. A toolchain that moves under us turns an
          # unrelated upstream release into a red build on a day nobody touched this repo.
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      # Both artifacts are supported configurations, not a build and a fallback (ADR 0011).
      - name: build single-threaded core
        run: cmake --preset wasm-release && cmake --build build/wasm-release
      - name: build threaded core
        run: cmake --preset wasm-release-threaded && cmake --build build/wasm-release-threaded

      - name: size budget
        run: |
          uv run --locked tools/size_budget.py --profile wasm-release \
            --build-dir build/wasm-release/bridge
          uv run --locked tools/size_budget.py --profile wasm-release-threaded \
            --build-dir build/wasm-release-threaded/bridge

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install deps
        run: npm ci && npx playwright install --with-deps chromium
      - name: shell unit tests
        run: npm test
      - name: build the shell
        run: npm run build
      # Serves each artifact with and without COOP/COEP, which is the only way to find out what
      # the deployment target actually does with it — and runs the shell end to end against the
      # built bundle rather than a dev server.
      - name: browser tests
        run: npx playwright test

# Not yet wired, and deliberately absent rather than stubbed green:
#   - FlatBuffers schema generation (needs the boundary runtime)
#   - time-to-first-viewfinder budget (needs the PWA shell)
# See docs/06-roadmap.md Phase 0.
