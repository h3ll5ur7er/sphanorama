      # ninja's belief that those objects are current, and ninja decides that from timestamps rather
      # than from who compiled them — so a runner image rotating to a different compiler would hand
      # back objects nothing can notice are stale, and link them. The identity file is the compiler,
      # ninja and cmake versions, so the miss happens exactly when the toolchain changes and not
      # weekly on an image number.
      - name: record the toolchain identity
        run: |
          { c++ --version; ninja --version; cmake --version; } > .toolchain-identity
          cat .toolchain-identity
      - name: cache the OpenCV build
        uses: actions/cache@v4
        with:
          path: |
            build/native-asan/_deps
            build/native-asan/.ninja_log
          key: opencv-native-asan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/opencv.cmake', '.toolchain-identity') }}
      - name: configure
        run: cmake --preset native-asan
      - name: build
        run: cmake --build build/native-asan
      - name: test
        run: ctest --test-dir build/native-asan --output-on-failure
      # The same guard as the native job's, against the same tree. This job gained `uv` and not this
      # step, while the commit message that added them said both jobs got both — so the sanitizer
      # run has been skipping the measurement silently, which is the exact failure the native step
      # exists to stop. Under ASan it is the more valuable of the two: the branch that added it also
      # changed pitch arithmetic and `cv::Mat` strides over pinned spans.
      - name: the accuracy measurement actually ran
        run: |
          log=$(mktemp)
          # `set +e` from here on: under `bash -e` a failing command aborts the step, and a step that
          # dies before `cat "$log"` is a red tick with no output — the failure this guard exists to
          # make visible. It covers the `expected=` line too, which CI was relying on to abort.
          set +e
          filter='EveryDetector/Accuracy.*:Acceptance.*'
