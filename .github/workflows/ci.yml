name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: architecture and contract rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv rather than a bare interpreter: the version and any dependency come from pyproject.toml
      # and uv.lock, so this job and a developer's machine resolve the same environment.
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      # The checker has its own suite: a broken checker that passes everything is worse than no
      # checker, because it reads as a green light.
      - name: layer checker tests
        run: uv run --locked tools/test_layer_check.py
      - name: layer rules
        run: uv run --locked tools/layer_check.py
      - name: contract generator tests
        run: uv run --locked tools/test_contract_gen.py
      - name: codec generator tests
        run: uv run --locked tools/test_codec_gen.py
      # Covers the TypeScript mirror and both halves of the wire codec: a header change that was
      # not regenerated is a red build rather than a boundary that disagrees with itself.
      - name: generated files are not stale
        run: uv run --locked tools/contract_gen.py --check
      - name: size budget checker tests
        run: uv run --locked tools/test_size_budget.py
      - name: no-browser checker tests
        run: uv run --locked tools/test_no_browser_check.py
      - name: no browser assumptions in the core
        run: uv run --locked tools/no_browser_check.py
      - name: conflict marker checker tests
        run: uv run --locked tools/test_conflict_marker_check.py
      - name: no conflict markers left behind
        run: uv run --locked tools/conflict_marker_check.py
      - name: table checker tests
        run: uv run --locked tools/test_markdown_table_check.py
      - name: no markdown table broken open
        run: uv run --locked tools/markdown_table_check.py
      # The only tooling step with a dependency, and it names the group that carries it rather than
      # putting numpy in every job's environment (ADR 0050).
      - name: dataset renderer tests
        run: uv run --locked --group datasets tools/test_synth_dataset.py

  native:
    name: native build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **The registration accuracy measurement shells out to the Python renderer and skips without
      # it.** `uv` is not on the runner by default, so this job ran that test's `GTEST_SKIP` on every
      # push while ctest reported "100% tests passed, 0 tests failed" — the exact shape of a
      # measurement nobody is taking and everybody believes is green.
      - uses: astral-sh/setup-uv@v5
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # OpenCV is fetched and built from source (ADR 0047), so without a cache every job on every push
      # rebuilds it. Keyed on `cmake/opencv.cmake`, which carries the pinned commit, so a version bump
      # misses deliberately; and on the preset, so the debug and sanitizer trees do not overwrite each
      # other's objects.
      #
      # `.ninja_log` is in the path deliberately and the cache did nothing without it. Ninja marks any
      # output with no log entry dirty, and the log lives beside the build directory rather than
      # inside `_deps` — so the first version of this cached 946 MB of OpenCV objects and then rebuilt
      # all 244 of its edges anyway. Restoring the log is safe: ninja still stats every input, so our
      # own sources, whose objects are not cached, rebuild exactly as they should.
      #
      # Which is also why `runner.os` alone was not enough to key it. Restoring the log restores
      # ninja's belief that those objects are current, and ninja decides that from timestamps rather
      # than from who compiled them — so a runner image rotating to a different compiler would hand
      # back objects nothing can notice are stale, and link them. The identity file is the compiler,
      # ninja and cmake versions, so the miss happens exactly when the toolchain changes and not
      # weekly on an image number.
      - name: record the toolchain identity
        run: |
          { c++ --version; ninja --version; cmake --version; } > .toolchain-identity
          cat .toolchain-identity
      - name: cache the OpenCV build
        uses: actions/cache@v4
        with:
          path: |
            build/native-debug/_deps
            build/native-debug/.ninja_log
          key: opencv-native-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/opencv.cmake', '.toolchain-identity') }}
      - name: configure
        run: cmake --preset native-debug
      - name: build
        run: cmake --build build/native-debug
      - name: test
        run: ctest --test-dir build/native-debug --output-on-failure
      # And say so if it skipped anyway. `ctest` reports a skipped test as a pass, so the step above
      # is green whether the measurement ran or not — which is the failure this job just had. Run
      # the accuracy cases on their own and fail on gtest's skip count, because the only thing worse
      # than an unmeasured number is an unmeasured number nobody can tell from a measured one.
      # **Green on zero tests was the first version's hole**, and a reviewer found it: a filter that
      # matches nothing prints "0 tests ran", contains no SKIPPED, and exits 0 — so renaming the
      # suite, deleting it, or building without OpenCV all reported the measurement as taken. The
      # check is therefore for the measurement's own output line, one per detector, rather than for
      # the absence of a bad word.
      - name: the accuracy measurement actually ran
        run: |
          log=$(mktemp)
          # `set +e` from here on: under `bash -e` a failing command aborts the step, and a step that
          # dies before `cat "$log"` is a red tick with no output — the failure this guard exists to
          # make visible. It covers the `expected=` line too, which CI was relying on to abort.
          set +e
          filter='EveryDetector/Accuracy.*:Acceptance.*'
          # How many `[accuracy]` lines a complete run prints, asked of the binary rather than
          # written down, so a fourth detector cannot go unmeasured.
          expected=$(./build/native-debug/bin/sphanorama_tests --gtest_list_tests \
            --gtest_filter='EveryDetector/Accuracy.ConsecutiveFrames*' | grep -c 'ConsecutiveFrames')
          ./build/native-debug/bin/sphanorama_tests --gtest_filter="$filter" >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          measured=$(grep -c '^\[accuracy\]' "$log" || true)
          # **Both counts go to zero together when the suite is renamed away**, so comparing them is
          # not enough — the first version of this check was green on a binary with no measurement in
          # it at all, which is precisely the hole it was written to close. The floor is what makes
          # the comparison mean something.
          if [ "$expected" -lt 1 ]; then
            echo "the binary contains no accuracy measurement to run" >&2
            status=1
          fi
          if [ "$measured" -ne "$expected" ]; then
            echo "the measurement ran $measured detectors and the binary has $expected" >&2
            status=1
          fi
          if grep -q SKIPPED "$log"; then
            echo "something skipped, and a skip is not a pass" >&2
            status=1
          fi
          rm -f "$log"
          exit $status

  sanitizers:
    name: address and undefined behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **The registration accuracy measurement shells out to the Python renderer and skips without
      # it.** `uv` is not on the runner by default, so this job ran that test's `GTEST_SKIP` on every
      # push while ctest reported "100% tests passed, 0 tests failed" — the exact shape of a
      # measurement nobody is taking and everybody believes is green.
